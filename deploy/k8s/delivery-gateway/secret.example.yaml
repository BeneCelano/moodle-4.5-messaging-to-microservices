# Template of the DeliveryGateway Secret, with placeholders: copy it outside the repository, fill it
# in and apply it.
#
#   cp secret.example.yaml /tmp/delivery-gateway-secret.yaml
#   # fill in the values
#   kubectl apply -f /tmp/delivery-gateway-secret.yaml
#   shred -u /tmp/delivery-gateway-secret.yaml
#
# The password in DG_DATABASE_URL is that of the `delivery_svc` user created by
# services/delivery/scripts/schema.sql.
apiVersion: v1
kind: Secret
metadata:
  name: delivery-gateway-secret
  namespace: messaging
  labels:
    app.kubernetes.io/name: delivery-gateway
    app.kubernetes.io/part-of: moodle-messaging
type: Opaque
stringData:
  DG_DATABASE_URL: "mysql+aiomysql://delivery_svc:PASSWORD@192.168.72.72:3306/delivery_gateway"
  # The in-cluster name, not the node port. Copy the whole value from CS_RABBITMQ_URL.
  DG_RABBITMQ_URL: "amqp://messaging:PASSWORD@rabbitmq.messaging.svc.cluster.local:5672/"
  # Token of the Airnotifier service (any value with the mock on VM4).
  DG_AIRNOTIFIER_TOKEN: "GETTONE"
