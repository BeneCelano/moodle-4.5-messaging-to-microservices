# Full-chain smoke test of the delivery: an event published on the exchange, consumed by the gateway,
# resolved into the recipient's channels on the real monolith data, delivered to the mocks.
#
#   kubectl delete job delivery-gateway-smoke -n messaging --ignore-not-found
#   kubectl apply -f smoke-job.yaml
#   kubectl -n messaging logs -f job/delivery-gateway-smoke
#
# It uses the ordinary credentials of the service and removes the rows it produced (add --keep to
# leave them). backoffLimit zero.
apiVersion: batch/v1
kind: Job
metadata:
  name: delivery-gateway-smoke
  namespace: messaging
  labels:
    app.kubernetes.io/name: delivery-gateway
    app.kubernetes.io/component: smoke
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: delivery-gateway
        app.kubernetes.io/component: smoke
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: smoke
          image: delivery-gateway:0.1.9
          imagePullPolicy: IfNotPresent
          # The mocks' address is read from DG_AIRNOTIFIER_URL in the environment ($(VAR)
          # expansion sees the variables of `env:` only, not those of `envFrom:`).
          command:
            - python
            - scripts/smoke.py
          envFrom:
            - configMapRef:
                name: delivery-gateway-config
            - secretRef:
                name: delivery-gateway-secret
          # Minimal memory reservation, to fit the namespace quota.
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "384Mi"
