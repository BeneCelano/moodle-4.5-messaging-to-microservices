# Exposure of the DeliveryGateway on a static node port, for the probes and the metrics
# endpoint.
apiVersion: v1
kind: Service
metadata:
  name: delivery-gateway
  namespace: messaging
  labels:
    app.kubernetes.io/name: delivery-gateway
    app.kubernetes.io/part-of: moodle-messaging
    app.kubernetes.io/component: delivery
spec:
  type: NodePort
  selector:
    # Name and role together: the name alone would also match the Job pods.
    app.kubernetes.io/name: delivery-gateway
    app.kubernetes.io/component: delivery
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30082
