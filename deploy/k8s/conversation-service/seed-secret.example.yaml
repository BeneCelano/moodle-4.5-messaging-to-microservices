# Template of the seed Secret, with a placeholder: copy it outside the repository, fill it in and
# apply it. The Jobs inherit everything else from the ConfigMap.
#
#   cp seed-secret.example.yaml /tmp/conversation-seed-secret.yaml
#   # fill in the credential
#   kubectl apply -f /tmp/conversation-seed-secret.yaml
#
# The reconciliation uses it too: remove Secret and user together when the migration is closed.
#
#   kubectl -n messaging delete secret conversation-service-seed-secret
#   # on VM2: DROP USER 'conversation_seed'@'%';
apiVersion: v1
kind: Secret
metadata:
  name: conversation-service-seed-secret
  namespace: messaging
  labels:
    app.kubernetes.io/name: conversation-service
    app.kubernetes.io/component: seed
type: Opaque
stringData:
  # Seed user: read on the monolith schema, write on the service's. The connection points to the
  # service schema.
  CS_DATABASE_URL: "mysql+aiomysql://conversation_seed:CHANGEME@192.168.72.72:3306/conversation_service"
