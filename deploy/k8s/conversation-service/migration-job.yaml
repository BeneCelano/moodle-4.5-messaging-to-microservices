# Application of the ConversationService schema migrations, by a Job run before the Deployment.
#
#   kubectl apply -f migration-job.yaml
#   kubectl -n messaging logs job/conversation-service-migrate
apiVersion: batch/v1
kind: Job
metadata:
  name: conversation-service-migrate
  namespace: messaging
  labels:
    app.kubernetes.io/name: conversation-service
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: conversation-service
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: migrate
          image: conversation-service:0.2.14
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: conversation-service-config
            - secretRef:
                name: conversation-service-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
