# Template of the ConversationService Secret, with placeholders: copy it outside the repository,
# fill it in and apply it.
#
#   cp secret.example.yaml /tmp/conversation-secret.yaml
#   # fill in the values
#   kubectl apply -f /tmp/conversation-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: conversation-service-secret
  namespace: messaging
  labels:
    app.kubernetes.io/name: conversation-service
    app.kubernetes.io/part-of: moodle-messaging
type: Opaque
stringData:
  # Dedicated application user, with privileges on the service schema only.
  CS_DATABASE_URL: "mysql+aiomysql://conversation_svc:CHANGEME@192.168.72.72:3306/conversation_service"

  # Credentials of the broker deployed in the namespace.
  CS_RABBITMQ_URL: "amqp://messaging:CHANGEME@rabbitmq.messaging.svc.cluster.local:5672/"

  # Token shared with the monolith (Authorization: Bearer).
  CS_API_TOKEN: "CHANGEME"
