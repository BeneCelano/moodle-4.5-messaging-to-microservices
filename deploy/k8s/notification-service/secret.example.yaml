# Template of the NotificationService Secret, with placeholders: copy it outside the repository,
# fill it in and apply it.
#
#   cp secret.example.yaml /tmp/notification-service-secret.yaml
#   # fill in the values
#   kubectl apply -f /tmp/notification-service-secret.yaml
#   shred -u /tmp/notification-service-secret.yaml
#
# The password in NS_DATABASE_URL is that of the `notification_svc` user created by
# services/notification/scripts/schema.sql.
apiVersion: v1
kind: Secret
metadata:
  name: notification-service-secret
  namespace: messaging
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/part-of: moodle-messaging
type: Opaque
stringData:
  NS_DATABASE_URL: "mysql+aiomysql://notification_svc:PASSWORD@192.168.72.72:3306/notification_service"
  # The in-cluster name, not the node port. Copy the whole value from CS_RABBITMQ_URL.
  NS_RABBITMQ_URL: "amqp://messaging:PASSWORD@rabbitmq.messaging.svc.cluster.local:5672/"
  # Token shared with the monolith: equal to $CFG->notificationservice_token in config.php.
  NS_API_TOKEN: "GETTONE"
