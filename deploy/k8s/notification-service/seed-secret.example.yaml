# Template of the seed and reconciliation Secret, with a placeholder: copy it outside the repository,
# fill it in and apply it. The Jobs inherit everything else from the ConfigMap.
#
#   cp seed-secret.example.yaml /tmp/notification-seed-secret.yaml
#   # fill in the credential
#   kubectl apply -f /tmp/notification-seed-secret.yaml
#   shred -u /tmp/notification-seed-secret.yaml
#
# The reconciliation uses it too: remove Secret and user together when the migration is closed.
#
#   kubectl -n messaging delete secret notification-service-seed-secret
#   # on VM2: DROP USER 'notification_seed'@'%';
apiVersion: v1
kind: Secret
metadata:
  name: notification-service-seed-secret
  namespace: messaging
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/component: seed
type: Opaque
stringData:
  # Seed user: read on the two copied tables of the monolith, write on the service schema.
  NS_DATABASE_URL: "mysql+aiomysql://notification_seed:CHANGEME@192.168.72.72:3306/notification_service"
