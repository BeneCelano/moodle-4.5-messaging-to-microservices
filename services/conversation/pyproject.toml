[project]
name = "conversation-service"
version = "0.1.0"
description = "ConversationService: bounded context extracted from Moodle's message subsystem"
requires-python = ">=3.11"
dependencies = [
    # Exact version, matching what runs on the cluster: a lower bound would make tomorrow's image
    # differ from the one that produced the phase 2 measures.
    "fastapi==0.141.1",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiomysql>=0.2.0",
    # Required by aiomysql for caching_sha2_password, the default authentication of MySQL 8.
    "cryptography>=43.0",
    "alembic>=1.14",
    "aio-pika>=9.5",
    "httpx>=0.27",
    "prometheus-client>=0.21",
    "python-json-logger>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "ruff>=0.7",
    "mypy>=1.13",
]

# Declared so that `pip install -e .` works: without it setuptools finds two top-level packages, `app`
# and `migrations`, and refuses to guess. The image does not go through this; the tests do.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
# Domain exceptions are named after the fact they describe: "raise NotAMember" reads better than
# "NotAMemberError".
ignore = ["N818"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = true
